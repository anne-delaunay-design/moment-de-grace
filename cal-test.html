<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test minimal Cal.com</title>
  <!-- AUCUN CSS du site principal -->
  <style>
    body { margin: 40px; font-family: sans-serif; background: #f5f5f5; }
    h1 { font-size: 18px; margin-bottom: 20px; }
    .test-label { font-size: 13px; color: #666; margin-bottom: 8px; }

    /* TEST A : aucun style du tout sur le container */
    #test-a-container { background: white; border: 2px solid blue; }

    /* TEST B : comme le site (après nos modifs) */
    #test-b-container {
      background: white;
      border: 2px solid green;
      min-height: 300px;
      border-radius: 8px;
    }

    /* TEST C : comme les recommandations Cal.com (overflow:scroll + height fixe) */
    #test-c-container {
      background: white;
      border: 2px solid red;
      width: 100%;
      height: 700px;
      overflow: scroll;
    }
  </style>
</head>
<body>
  <h1>Test minimal Cal.com — isolation totale du site</h1>
  <p style="font-size:13px;color:#888;">Ouvre la console (F12) pour voir les mesures automatiques.</p>

  <hr>
  <p class="test-label">TEST A — Aucun style sur le container (vide total)</p>
  <button onclick="initCal('30min','a')">Activer TEST A (30min)</button>
  <div id="test-a-container">
    <div id="my-cal-test-a" style="width:100%"></div>
  </div>

  <hr style="margin: 40px 0">
  <p class="test-label">TEST B — Comme le site actuel (aucune hauteur fixe)</p>
  <button onclick="initCal('30min','b')">Activer TEST B (30min)</button>
  <div id="test-b-container">
    <div id="my-cal-test-b" style="width:100%"></div>
  </div>

  <hr style="margin: 40px 0">
  <p class="test-label">TEST C — Style officiel Cal.com (overflow:scroll + height:700px)</p>
  <button onclick="initCal('30min','c')">Activer TEST C (30min)</button>
  <div id="test-c-container">
    <div id="my-cal-test-c" style="width:100%;height:100%;overflow:scroll"></div>
  </div>

  <!-- Cal.com embed -->
  <script>
    (function (C, A, L) {
      let p = function (a, ar) { a.q.push(ar); };
      let d = C.document;
      C.Cal = C.Cal || function () {
        let cal = C.Cal; let ar = arguments;
        if (!cal.loaded) {
          cal.ns = {}; cal.q = cal.q || [];
          d.head.appendChild(d.createElement("script")).src = A;
          cal.loaded = true;
        }
        if (ar[0] === L) {
          const api = function () { p(api, arguments); };
          const namespace = ar[1];
          api.q = api.q || [];
          if (typeof namespace === "string") {
            cal.ns[namespace] = cal.ns[namespace] || api;
            p(cal.ns[namespace], ar);
            p(cal, ["initNamespace", namespace]);
          } else p(cal, ar);
          return;
        }
        p(cal, ar);
      };
    })(window, "https://app.cal.com/embed/embed.js", "init");

    const initialized = {};

    function initCal(type, testId) {
      const ns = type + '-test-' + testId;
      const selector = '#my-cal-test-' + testId;

      if (initialized[ns]) {
        console.log('[DIAG] Déjà initialisé :', ns);
        setTimeout(() => runDiag(testId), 2000);
        return;
      }
      initialized[ns] = true;

      Cal("init", ns, { origin: "https://app.cal.com" });
      Cal.ns[ns]('inline', {
        elementOrSelector: selector,
        config: { layout: 'month_view', useSlotsViewOnSmallScreen: 'true' },
        calLink: 'momentdegrace/' + type,
      });
      Cal.ns[ns]('ui', { hideEventTypeDetails: false, layout: 'month_view' });

      console.log('[DIAG] Cal.com initialisé pour test', testId.toUpperCase(), '— diagnostic dans 3s');
      setTimeout(() => runDiag(testId), 3000);
    }

    // ─── Écoute __dimensionChanged ───────────────────────────────────────────
    window.addEventListener('message', function(e) {
      if (e.data && typeof e.data === 'object') {
        if (e.data.type === '__dimensionChanged' || (e.data.data && e.data.data.iframeHeight)) {
          console.log('[Cal.com __dimensionChanged reçu]', JSON.stringify(e.data));
        }
      }
    });

    // ─── Diagnostic ─────────────────────────────────────────────────────────
    function runDiag(testId) {
      const root = document.getElementById('my-cal-test-' + testId);
      if (!root) return;

      console.group('════ DIAGNOSTIC TEST ' + testId.toUpperCase() + ' ════');

      // 1. Remonte la chaîne des parents
      console.group('Chaîne parents (depuis #my-cal-test-' + testId + ')');
      let el = root;
      let depth = 0;
      while (el && el.tagName !== 'BODY') {
        const cs = getComputedStyle(el);
        const scrollable = el.scrollHeight > el.clientHeight + 2;
        console.log(
          (scrollable ? '⚠️ SCROLL ' : '   ok     ') + depth + ':',
          el.tagName + (el.id ? '#' + el.id : ''),
          {
            clientH: el.clientHeight,
            scrollH: el.scrollHeight,
            height_computed: cs.height,
            overflow: cs.overflow,
            overflowY: cs.overflowY,
            display: cs.display,
            position: cs.position,
          }
        );
        el = el.parentElement;
        depth++;
      }
      console.groupEnd();

      // 2. Enfants directs (wrappers injectés par Cal.com)
      console.group('Enfants injectés par Cal.com dans le div cible');
      function logChildren(parent, indent) {
        Array.from(parent.children).forEach((child, i) => {
          const cs = getComputedStyle(child);
          const scrollable = child.scrollHeight > child.clientHeight + 2;
          console.log(
            indent + (scrollable ? '⚠️ SCROLL ' : '   ok     ') + i + ':',
            child.tagName + (child.id ? '#' + child.id : '') + (child.className ? '.' + String(child.className).split(' ').slice(0,2).join('.') : ''),
            {
              clientH: child.clientHeight,
              scrollH: child.scrollHeight,
              height_inline: child.style.height,
              height_computed: cs.height,
              overflow: cs.overflow,
              overflowY: cs.overflowY,
              display: cs.display,
              position: cs.position,
            }
          );
          if (child.tagName !== 'IFRAME' && child.children.length > 0 && child.children.length < 5) {
            logChildren(child, indent + '  ');
          }
        });
      }
      logChildren(root, '');
      console.groupEnd();

      // 3. Inspect iframe
      const iframe = root.querySelector('iframe');
      if (iframe) {
        const cs = getComputedStyle(iframe);
        console.group('IFRAME Cal.com');
        console.log({
          'src (80c)': iframe.src.substring(0, 80),
          clientH: iframe.clientHeight,
          scrollH: iframe.scrollHeight,
          'style.height (inline)': iframe.style.height || '(non défini)',
          'computed height': cs.height,
          overflow: cs.overflow,
          overflowY: cs.overflowY,
        });
        // On ne peut pas accéder au contenu de l'iframe (cross-origin)
        try {
          iframe.contentWindow.document; // va lever une erreur si cross-origin
          console.log('Iframe accessible (same-origin) — analyse interne possible');
        } catch(e) {
          console.log('⚠️ Iframe CROSS-ORIGIN (app.cal.com) : impossible d\'inspecter l\'intérieur depuis JS.');
          console.log('→ Si le scroll est là-dedans, il est géré par Cal.com côté serveur.');
        }
        console.groupEnd();
      } else {
        console.warn('Aucun iframe trouvé dans ce conteneur (pas encore chargé ?)');
      }

      console.groupEnd(); // fin groupe test
    }

    window.runDiag = runDiag;
    console.log('[DIAG] Page test prête. Clique sur un bouton "Activer" pour lancer.');
  </script>
</body>
</html>
